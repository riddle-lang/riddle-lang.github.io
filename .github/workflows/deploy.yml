name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed by actions/deploy-pages: read the repo, mint an OIDC token, publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-flight run, but never a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: withastro/action@v6
        with:
          node-version: 20

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
